name: Compilation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compiler:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # le .jar publié est celui compilé contre 1.21.1 ; les autres vérifient que le code reste compatible
        paper: ["1.21.1-R0.1-SNAPSHOT", "1.21.4-R0.1-SNAPSHOT", "1.21.11-R0.1-SNAPSHOT", "26.2.build.+"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - name: Compiler et tester
        run: gradle build tests -PpaperApi="${{ matrix.paper }}"
      - name: Garder le .jar
        if: matrix.paper == '1.21.1-R0.1-SNAPSHOT'
        uses: actions/upload-artifact@v4
        with:
          name: Vorace
          path: build/libs/Vorace-*.jar
