name: Essai Orario

# Essai sur la vraie map d'Orario (extrait du serveur : 2 fichiers de région du centre et de l'est, animaux, modèles, rangé
# dans la branche « essai-orario-donnees ») : pigeons, bains d'oiseaux, moutons, vaches, chats, cerfs, redémarrage. Lancé par un commit dont le message contient [orario], ou à la main.
on:
  push:
  workflow_dispatch:

jobs:
  essai-orario:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[orario]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.2.0"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Compiler Vorace
        run: gradle build -x test -PpaperApi="1.21.1-R0.1-SNAPSHOT" && ls build/libs
      - name: Serveur Orario (branche essai-orario-donnees)
        run: |
          git fetch --depth 1 origin essai-orario-donnees
          mkdir -p donnees && git show FETCH_HEAD:Orario_essai.zip > donnees/Orario_essai.zip && ls -la donnees
      - name: Faux joueur
        run: cd outils && npm init -y > /dev/null && npm install --no-audit --no-fund mineflayer && pip install pyyaml
      - name: Essai sur la map
        run: outils/essai-orario.sh donnees/$(ls donnees | head -1) build/libs
