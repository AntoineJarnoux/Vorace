name: Essai Orario

# Essai sur la vraie map d'Orario (zip du serveur publié dans la release « essai-orario ») : animaux, pigeons, bains
# d'oiseaux, redémarrage. Lancé à la main (Actions > Essai Orario > Run workflow).
on:
  workflow_dispatch:

jobs:
  essai-orario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.2.0"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Compiler Vorace
        run: gradle build -x test -PpaperApi="1.21.1-R0.1-SNAPSHOT" && ls build/libs
      - name: Serveur Orario (release essai-orario)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download essai-orario --pattern '*.zip' --dir donnees && ls -la donnees
      - name: Faux joueur
        run: cd outils && npm init -y > /dev/null && npm install --no-audit --no-fund mineflayer && pip install pyyaml
      - name: Essai sur la map
        run: outils/essai-orario.sh donnees/$(ls donnees | head -1) build/libs
