name: Release

# Quand une release est publiée sur GitHub, le plugin est compilé et le .jar y est ajouté.
on:
  release:
    types: [published]
  # pour (re)mettre le .jar sur une release déjà publiée : Actions > Release > Run workflow
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex : Vorace-0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.2.0"
      - name: Compiler et tester
        run: gradle build tests
      - name: Ajouter le .jar à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" build/libs/Vorace-*.jar --clobber
