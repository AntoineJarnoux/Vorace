name: Release

# Quand une release est publiée sur GitHub, le plugin est compilé et le .jar y est ajouté.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.2.0"
      - name: Compiler et tester
        run: gradle build tests
      - name: Ajouter le .jar à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/Vorace-*.jar --clobber
